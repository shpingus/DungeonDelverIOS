name: DungeonDelverIOS
options:
  bundleIdPrefix: com.ruppin
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DungeonDelverIOS:
    type: application
    platform: iOS
    sources:
      - path: DungeonDelverIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruppin.DungeonDelverIOS
        INFOPLIST_FILE: DungeonDelverIOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTED_INTERFACE_ORIENTATIONS_IPHONE: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        UILAUNCHSCREEN_GENERATION: YES
    scheme:
      testTargets:
        - DungeonDelverIOSTests
  DungeonDelverIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DungeonDelverIOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DungeonDelverIOS
